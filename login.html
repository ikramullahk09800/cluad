<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | FastVPS.com</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">FastVPS<span>.com</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#pricing">Pricing</a></li>
                <li><a href="index.html#os">OS Options</a></li>
                <li><a href="signup.html" class="btn">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <span class="eyebrow">// authenticate</span>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to manage your VPS servers.</p>

            <form id="loginForm" class="auth-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <div id="formMessage" class="form-message"></div>

                <button type="submit" class="btn-primary auth-btn">Log In</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 FastVPS.com. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('formMessage');
            // NOTE: This is a static demo form only.
            // Connect this to a real backend (e.g. Firebase, Supabase, or your own API)
            // to actually authenticate users.
            msg.textContent = 'Demo only: connect a backend to enable real login.';
            msg.className = 'form-message info';
        });
    </script>

</body>
</html>
